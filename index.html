<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f2847">
  <meta name="description" content="Offline logbook for machinery manuals, photos and maintenance records.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Logbook">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Machinery Logbook</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="backBtn" aria-label="Back" hidden>&#8592;</button>
    <h1 id="title">Machinery Logbook</h1>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">&#9881;</button>
  </header>

  <main id="app" aria-live="polite"></main>

  <dialog id="dlg"></dialog>

  <div id="viewer" class="viewer" hidden>
    <img id="viewerImg" alt="">
    <div class="viewer-bar">
      <button class="btn ghost light" id="viewerDelete">Delete</button>
      <button class="btn light" id="viewerClose">Close</button>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <input type="file" id="pickCamera" accept="image/*" capture="environment" hidden>
  <input type="file" id="pickGallery" accept="image/*" multiple hidden>
  <input type="file" id="pickManual" accept="application/pdf,image/*,.doc,.docx,.xls,.xlsx,.txt" multiple hidden>
  <input type="file" id="pickBackup" accept="application/json,.json" hidden>

  <script src="app.js"></script>
</body>
</html>
